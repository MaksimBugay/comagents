apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  labels:
    app.kubernetes.io/name: agent-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-orchestrator
    spec:
      # service-link env vars (AGENT_ORCHESTRATOR_*) would leak into Micronaut config as agent-orchestrator.* properties
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-orchestrator
          image: agent-orchestrator:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_ORCHESTRATOR_VERSION
              value: "0.1"
            # kubectl create secret generic agent-orchestrator-secrets \
            #   --from-literal=pushca-api-key="$PUSHCA_API_KEY"
            - name: PUSHCA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-orchestrator-secrets
                  key: pushca-api-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-orchestrator
  labels:
    app.kubernetes.io/name: agent-orchestrator
spec:
  selector:
    app.kubernetes.io/name: agent-orchestrator
  ports:
    - name: http
      port: 80
      targetPort: http
