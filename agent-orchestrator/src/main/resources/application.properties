micronaut.application.name=agent-orchestrator

agent-orchestrator.version=${AGENT_ORCHESTRATOR_VERSION:0.1}
# which agent-orchestrator this is (its Pushca device id); when not set: the Docker container id, the Kubernetes pod
# UID, or the host name (DeviceIdExtractor)
agent-orchestrator.device-id=${AGENT_ORCHESTRATOR_DEVICE_ID:}

# Kubernetes probes: /health/liveness and /health/readiness
endpoints.health.enabled=true
endpoints.health.sensitive=false

# Pushca: the transport between orchestrators and agent executors (organization already registered; no default for
# the key: supply via env, never commit it)
# backticks: a default value with a colon in it would otherwise be cut at the colon
pushca.api-url=${PUSHCA_API_URL:`https://secure.fileshare.ovh/pushca`}
pushca.api-key=${PUSHCA_API_KEY}
pushca.connect-timeout=${PUSHCA_CONNECT_TIMEOUT:10s}
# how long a message for an agent executor may take to be sent; one not sent by then is dropped with an error logged.
# Sends that find the connection broken are retried every second until then
agent-orchestrator.message-timeout=${AGENT_ORCHESTRATOR_MESSAGE_TIMEOUT:30s}
