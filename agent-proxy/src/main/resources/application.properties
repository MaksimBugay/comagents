micronaut.application.name=agent-proxy

# byte[] fields (e.g. AgentResponse.body) as base64 strings in JSON, not arrays of numbers
micronaut.serde.write-binary-as-array=false

agent-proxy.version=${AGENT_PROXY_VERSION:0.1}

# Kubernetes probes: /health/liveness and /health/readiness
endpoints.health.enabled=true
endpoints.health.sensitive=false

# Agent sources repository (no defaults: supply via env, never commit the token)
clone.comagents.sources.url=${CLONE_COMAGENTS_SOURCES_URL}
sources.repo.access-token=${SOURCES_REPO_ACCESS_TOKEN}

# Claude API key for headless Claude Code (no default: supply via env, never commit the key)
anthropic.api-key=${ANTHROPIC_API_KEY}

# headless Claude Code runs (claude -p), see spec/claude_q_and_a.md
claude.executable=${CLAUDE_EXECUTABLE:claude}
claude.session.max-concurrent=${CLAUDE_SESSION_MAX_CONCURRENT:2}
claude.session.timeout=${CLAUDE_SESSION_TIMEOUT:60m}
# a session without any output for this long is stopped and all its files deleted
claude.session.idle-timeout=${CLAUDE_SESSION_IDLE_TIMEOUT:10m}

# session files are deleted this long after the agent response was first fetched
agent-response.cleanup-delay=${AGENT_RESPONSE_CLEANUP_DELAY:5m}
