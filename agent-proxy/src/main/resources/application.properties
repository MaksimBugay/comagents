micronaut.application.name=agent-proxy

# byte[] fields (e.g. AgentResponse.body) as base64 strings in JSON, not arrays of numbers
micronaut.serde.write-binary-as-array=false

agent-proxy.version=${AGENT_PROXY_VERSION:0.1}

# Kubernetes probes: /health/liveness and /health/readiness
endpoints.health.enabled=true
endpoints.health.sensitive=false

# Agent sources repository (no defaults: supply via env, never commit the token)
clone.comagents.sources.url=${CLONE_COMAGENTS_SOURCES_URL}
sources.repo.access-token=${SOURCES_REPO_ACCESS_TOKEN}

# Claude API key for headless Claude Code (no default: supply via env, never commit the key)
anthropic.api-key=${ANTHROPIC_API_KEY}

# Pushca: every session mirrors its output into its own close private chat (organization already registered;
# no default for the key: supply via env, never commit it)
# backticks: a default value with a colon in it would otherwise be cut at the colon
pushca.api-url=${PUSHCA_API_URL:`https://secure.fileshare.ovh/pushca`}
pushca.api-key=${PUSHCA_API_KEY}
# the chat page; the join link of each new session chat is logged
pushca.chat-url=${PUSHCA_CHAT_URL:`https://secure.fileshare.ovh/chat-room.html`}
pushca.connect-timeout=${PUSHCA_CONNECT_TIMEOUT:10s}

# agent-proxy's own MCP server: stateless HTTP on /mcp, passed to every Claude Code run with --mcp-config;
# Claude Code reaches it from inside the container, so the default is the local port
micronaut.mcp.server.transport=HTTP
micronaut.mcp.server.info.name=agent-proxy
micronaut.mcp.server.info.version=${agent-proxy.version}
agent-proxy.mcp-url=${AGENT_PROXY_MCP_URL:`http://127.0.0.1:8080/mcp`}
# how long the ask_expert tool waits for an answer in the session chat; Claude Code aborts an HTTP MCP call
# without a response after 5 min, so keep it below that
agent-question.answer-timeout=${AGENT_QUESTION_ANSWER_TIMEOUT:4m}

# one folder per session (repo clone, agent files, Claude Code state, transcript, response); persistent storage
# here lets archived sessions and responses survive restarts. /tmp stays for scratch files only.
agent-proxy.sessions-dir=${AGENT_PROXY_SESSIONS_DIR:/var/lib/agent-proxy/sessions}

# headless Claude Code runs (claude -p), see spec/claude_q_and_a.md
claude.executable=${CLAUDE_EXECUTABLE:claude}
claude.session.max-concurrent=${CLAUDE_SESSION_MAX_CONCURRENT:2}
claude.session.timeout=${CLAUDE_SESSION_TIMEOUT:60m}
# a session without any output for this long is stopped and all its files deleted
claude.session.idle-timeout=${CLAUDE_SESSION_IDLE_TIMEOUT:10m}

# session files are deleted this long after the agent response was first fetched
agent-response.cleanup-delay=${AGENT_RESPONSE_CLEANUP_DELAY:5m}
