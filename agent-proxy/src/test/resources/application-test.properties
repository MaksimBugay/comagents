# placeholders so AgentProxyConf can be created; tests never contact GitHub, the Claude API or Pushca
clone.comagents.sources.url=https://github.com/example/comagents.git
sources.repo.access-token=test-token
anthropic.api-key=test-api-key
pushca.api-key=test-pushca-key
agent-proxy.ai-harness-provider=CLAUDE_CODE
# no AgentInfoResponse broadcasts in the middle of tests that count what was sent; AgentDiscoveryClientTest sends its own
agent-proxy.discovery-interval=1h
# a writable sessions dir for tests (the default /var/lib/agent-proxy/sessions is the container's)
agent-proxy.sessions-dir=target/test-sessions
