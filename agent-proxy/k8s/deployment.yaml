apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-proxy
  labels:
    app.kubernetes.io/name: agent-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-proxy
    spec:
      # service-link env vars (AGENT_PROXY_*) would leak into Micronaut config as agent-proxy.* properties
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-proxy
          image: agent-proxy:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_PROXY_VERSION
              value: "0.1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-proxy
  labels:
    app.kubernetes.io/name: agent-proxy
spec:
  selector:
    app.kubernetes.io/name: agent-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
