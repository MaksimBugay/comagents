apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-proxy
  labels:
    app.kubernetes.io/name: agent-proxy
spec:
  # one replica: sessions live in the pod's memory and /tmp, so status and response calls must reach the pod that
  # runs the session (spec/known_gaps.md, gap 3)
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-proxy
    spec:
      # service-link env vars (AGENT_PROXY_*) would leak into Micronaut config as agent-proxy.* properties
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-proxy
          image: agent-proxy:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_PROXY_VERSION
              value: "0.1"
            - name: CLONE_COMAGENTS_SOURCES_URL
              value: https://github.com/MaksimBugay/comagents.git
            # kubectl create secret generic agent-proxy-secrets \
            #   --from-literal=sources-repo-access-token="$SOURCES_REPO_ACCESS_TOKEN" \
            #   --from-literal=anthropic-api-key="$ANTHROPIC_API_KEY"
            - name: SOURCES_REPO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-proxy-secrets
                  key: sources-repo-access-token
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-proxy-secrets
                  key: anthropic-api-key
            # memory below is sized for this many parallel Claude Code runs
            - name: CLAUDE_SESSION_MAX_CONCURRENT
              value: "2"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # the only writable path: session folders, including each session's Claude Code state
          # (agent-proxy points CLAUDE_CONFIG_DIR at /tmp/<session id>/<agent name>/claude-state)
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
      volumes:
        # cloned repositories, agent files, responses and Claude Code state; deleted with the pod
        - name: tmp
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-proxy
  labels:
    app.kubernetes.io/name: agent-proxy
spec:
  selector:
    app.kubernetes.io/name: agent-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
