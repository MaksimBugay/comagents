micronaut.application.name=llm-watchdog

# Kubernetes probes: /health/liveness and /health/readiness
endpoints.health.enabled=true
endpoints.health.sensitive=false

# the LLM provider every call goes to, with the provider's API key: only this service has it, Claude Code gets the
# key of its session in its place (no default for the key: supply via env, never commit it). Any Anthropic Messages
# API, e.g. DeepSeek's https://api.deepseek.com/anthropic
# backticks: a default value with a colon in it would otherwise be cut at the colon
llm-watchdog.anthropic-url=${ANTHROPIC_BASE_URL:`https://api.anthropic.com`}
llm-watchdog.anthropic-api-key=${ANTHROPIC_API_KEY}
micronaut.http.services.anthropic.url=${llm-watchdog.anthropic-url}
# a model answers a long request in minutes, streamed or not
micronaut.http.services.anthropic.read-timeout=${LLM_WATCHDOG_READ_TIMEOUT:10m}
# a request carries the whole conversation so far, images and documents included
micronaut.server.max-request-size=${LLM_WATCHDOG_MAX_REQUEST_SIZE:100MB}
