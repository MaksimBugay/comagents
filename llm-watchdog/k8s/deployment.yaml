apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-watchdog
  labels:
    app.kubernetes.io/name: llm-watchdog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-watchdog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-watchdog
    spec:
      # service-link env vars (LLM_WATCHDOG_*) would leak into Micronaut config as llm-watchdog.* properties
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm-watchdog
          image: llm-watchdog:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # any Anthropic Messages API; Anthropic's own when not set
            - name: ANTHROPIC_BASE_URL
              value: https://api.anthropic.com
            # kubectl create secret generic llm-watchdog-secrets \
            #   --from-literal=anthropic-api-key="$ANTHROPIC_API_KEY"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-watchdog-secrets
                  key: anthropic-api-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: llm-watchdog
  labels:
    app.kubernetes.io/name: llm-watchdog
spec:
  selector:
    app.kubernetes.io/name: llm-watchdog
  ports:
    - name: http
      port: 80
      targetPort: http
